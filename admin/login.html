<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Van Mitra Admin</title>
<style>
  :root{--bg:#0f1f17;--card:#16291f;--ink:#e8f1ea;--muted:#9db5a5;--accent:#7cc47f;--line:#264535}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;width:min(320px,90vw)}
  h1{font-size:20px;margin:0 0 4px} p{margin:0 0 18px;color:var(--muted);font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0c1812;color:var(--ink);font-size:20px;letter-spacing:6px;text-align:center}
  button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#0c1812;font-weight:600;font-size:15px;cursor:pointer}
  .err{color:#ff9b8a;font-size:14px;margin-top:10px}
</style></head>
<body>
<form method="post">
  <h1>Van Mitra · Admin</h1>
  <p>Enter the PIN to view visitor statistics.</p>
  <input name="pin" type="password" inputmode="numeric" autofocus autocomplete="off">
  <button>Open</button>
  {% if error %}<div class="err">Wrong PIN.</div>{% endif %}
</form>
</body></html>
